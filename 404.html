<!doctype html>
<html lang="cs" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>404 • Stránka nenalezena</title>
  <meta name="description" content="Stránka nebyla nalezena. Návrat na hlavní stránku." />
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="assets/site.css" />
  <script src="assets/site.js" defer></script>

  <style>
    .center{
      min-height: calc(100vh - 76px);
      display:grid;
      place-items:center;
      padding: 24px 18px 60px;
    }
    .box{
      max-width: 920px;
      width:100%;
    }
    .glitch{
      position:relative;
      font-size: 84px;
      line-height: .9;
      letter-spacing: -.04em;
      margin: 6px 0 10px;
      text-shadow: 0 0 26px rgba(255,45,45,.18);
    }
    .glitch::before,
    .glitch::after{
      content: attr(data-text);
      position:absolute;
      left:0; top:0;
      width:100%;
      overflow:hidden;
      opacity:.55;
    }
    .glitch::before{
      transform: translate(2px, -1px);
      clip-path: inset(0 0 55% 0);
      animation: g1 2.2s infinite linear alternate-reverse;
    }
    .glitch::after{
      transform: translate(-2px, 1px);
      clip-path: inset(55% 0 0 0);
      animation: g2 1.8s infinite linear alternate-reverse;
    }
    @keyframes g1{
      0%{clip-path: inset(0 0 60% 0)}
      25%{clip-path: inset(10% 0 45% 0)}
      50%{clip-path: inset(0 0 70% 0)}
      75%{clip-path: inset(18% 0 35% 0)}
      100%{clip-path: inset(6% 0 58% 0)}
    }
    @keyframes g2{
      0%{clip-path: inset(60% 0 0 0)}
      25%{clip-path: inset(52% 0 0 0)}
      50%{clip-path: inset(72% 0 0 0)}
      75%{clip-path: inset(40% 0 0 0)}
      100%{clip-path: inset(62% 0 0 0)}
    }

    .links{display:flex; flex-wrap:wrap; gap:10px; margin-top: 14px}
    .hint{
      margin-top: 12px;
      border-top:1px solid var(--border);
      padding-top: 12px;
    }
    .path{
      display:inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      border:1px solid var(--border);
      background: color-mix(in oklab, var(--card) 78%, transparent);
      color: color-mix(in oklab, var(--fg) 86%, var(--muted));
      font-size: 13px;
    }
  </style>
</head>

<body class="fx">
  <a class="skip" href="#obsah">Přeskočit na obsah</a>

  <header>
    <div class="nav" role="navigation" aria-label="Hlavní navigace">
      <a class="brand" href="index.html" aria-label="Domů">
        <span class="mark" aria-hidden="true"></span>
        <div>
          <b>Adam</b>
          <div><span>404 • recovery</span></div>
        </div>
      </a>

      <div class="navRight">
        <button class="btn small" type="button" data-theme-toggle>
          Motiv: <span data-theme-label>auto</span>
        </button>
        <a class="btn small" href="project/index.html">Projekt</a>
      </div>
    </div>
  </header>

  <main id="obsah" class="center">
    <div class="box panel pad">
      <div class="kicker"><i aria-hidden="true"></i> NOT FOUND</div>
      <div class="glitch" data-text="404">404</div>
      <p class="lead">Tato stránka neexistuje, nebo se změnila adresa. Nejrychlejší návrat je na hlavní stránku.</p>

      <div class="links">
        <a class="btn primary" href="index.html">Domů</a>
        <a class="btn" href="project/index.html">Otevřít projekt</a>
        <a class="btn" href="https://github.com/PyroStonee/test.novakad.cz" target="_blank" rel="noopener">Repo webu</a>
      </div>

      <div class="hint">
        <div class="fine">Pokud jste sem přišel přes starý odkaz, zkuste jednu z cest:</div>
        <div style="margin-top:10px; display:flex; flex-wrap:wrap; gap:8px">
          <span class="path">/</span>
          <span class="path">/project/</span>
          <span class="path">/index.html</span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
